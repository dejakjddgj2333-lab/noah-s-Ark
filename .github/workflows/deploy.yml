name: deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测改动范围
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'server/**'
              - 'docker-compose.yml'
              - '.env.config'
            admin:
              - 'admin/**'
            all:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND: ${{ steps.changes.outputs.backend }}
          ADMIN: ${{ steps.changes.outputs.admin }}
          ALL: ${{ steps.changes.outputs.all }}
          APITUBE_API_KEY: ${{ secrets.APITUBE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND,ADMIN,ALL,APITUBE_API_KEY,DEEPSEEK_API_KEY
          script: |
            cd /www/wwwroot/hk/repo
            git fetch origin master
            git reset --hard origin/master

            TARGETS=""
            [ "$ALL" = "true" ] && TARGETS="all"
            if [ -z "$TARGETS" ]; then
              [ "$BACKEND" = "true" ] && TARGETS="$TARGETS backend"
              [ "$ADMIN" = "true" ] && TARGETS="$TARGETS admin"
            fi

            if [ -z "$TARGETS" ]; then
              echo "无相关改动,跳过部署"
              exit 0
            fi

            # 敏感 key 从 GitHub Secrets 写入运行目录 (不入库, push protection 拦 sk- 类 key)
            if [ "$BACKEND" = "true" ] || [ "$ALL" = "true" ]; then
              echo "secrets 长度: APITUBE=${#APITUBE_API_KEY} DEEPSEEK=${#DEEPSEEK_API_KEY}"
              umask 077
              cat > /www/wwwroot/shipapi.bdxapi.com/.env.secrets <<EOF
            APITUBE_API_KEY=$APITUBE_API_KEY
            DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
            EOF
            fi

            bash deploy/deploy.sh $TARGETS
