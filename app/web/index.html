<!DOCTYPE html>
<html>
<head>
  <script>
    // PC 浏览器访问移动站 -> 跳 PC 域名
    (function () {
      var mobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent)
      if (!mobile && location.hostname === 'm.mingcevip.com') location.replace('https://mingcevip.com/')
    })()
  </script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover 让 iOS 报告安全区 (env(safe-area-inset-*)), 否则 Web Clip
       全屏下底部横条遮挡 Tab 栏. Flutter 引擎启动后会接管 viewport meta, 用
       MutationObserver 保证 viewport-fit=cover 不被引擎覆盖丢掉. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    (function () {
      function ensureViewportFit() {
        var m = document.querySelector('meta[name="viewport"]')
        if (!m) return
        if (!/viewport-fit\s*=\s*cover/.test(m.content)) {
          m.content = m.content.replace(/,?\s*viewport-fit\s*=\s*\w+/, '') + ', viewport-fit=cover'
        }
      }
      new MutationObserver(ensureViewportFit).observe(document.head, {
        subtree: true, childList: true, attributes: true, attributeFilter: ['content']
      })
      ensureViewportFit()
    })()
  </script>
  <script>
    // iOS/iPadOS 26.1 Web Clip 全屏回归 bug (WebKit#301994):
    // env(safe-area-inset-top) 恒为 0 且状态栏不透明压住页面, 顶部按钮点不到.
    // 检测 26.1 + standalone (Web Clip) 后写全局值, Dart 侧 McAppHeader 读取
    // 并手动补顶部间距. 26.2 已修复, 此补偿只命中 26.1.
    (function () {
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      if (/OS 26_1/.test(navigator.userAgent) && standalone) {
        window.__mcIos261TopInset = 59 // 灵动岛机型状态栏高 59pt, 刘海 47pt 多补一点无碍
      }
    })()
  </script>
  <meta name="description" content="明策 MINGCE 市场情报终端">

  <!-- iOS meta tags & icons -->
  <meta name="theme-color" content="#070D1C">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- black-translucent: 页面延伸到状态栏后面, 状态栏区域透出 App 自己的深色
       顶栏 (header SafeArea 已处理避让). 旧的 black(不透明黑条) 在新版 iOS
       上会被忽略并回落成 default(白底), 导致部分机型状态栏发白. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="明策">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- 文档底色与主题色一致: 状态栏透出区/启动首帧/回退路径都不再露白 -->
  <style>html, body { background-color: #070D1C; }</style>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>明策 MINGCE</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--

    * https://docs.flutter.dev/platform-integration/web/initialization

</body>
</html>
