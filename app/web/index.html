<!DOCTYPE html>
<html>
<head>
  <script>
    // PC 浏览器访问移动站 -> 跳 PC 域名
    (function () {
      var mobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent)
      if (!mobile && location.hostname === 'm.mingcevip.com') location.replace('https://mingcevip.com/')
    })()
  </script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover 让 iOS 报告安全区 (env(safe-area-inset-*)), 否则 Web Clip
       全屏下底部横条遮挡 Tab 栏. Flutter 引擎启动后会接管 viewport meta, 用
       MutationObserver 保证 viewport-fit=cover 不被引擎覆盖丢掉. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    (function () {
      function ensureViewportFit() {
        var m = document.querySelector('meta[name="viewport"]')
        if (!m) return
        if (!/viewport-fit\s*=\s*cover/.test(m.content)) {
          m.content = m.content.replace(/,?\s*viewport-fit\s*=\s*\w+/, '') + ', viewport-fit=cover'
        }
      }
      new MutationObserver(ensureViewportFit).observe(document.head, {
        subtree: true, childList: true, attributes: true, attributeFilter: ['content']
      })
      ensureViewportFit()
    })()
  </script>
  <meta name="description" content="明策 MINGCE 市场情报终端">

  <!-- iOS meta tags & icons -->
  <meta name="theme-color" content="#070D1C">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- black-translucent: 页面延伸到状态栏后面, 状态栏区域透出 App 自己的深色
       顶栏 (header SafeArea 已处理避让). 旧的 black(不透明黑条) 在新版 iOS
       上会被忽略并回落成 default(白底), 导致部分机型状态栏发白. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="明策">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- 文档底色与主题色一致: 状态栏透出区/启动首帧/回退路径都不再露白 -->
  <style>html, body { background-color: #070D1C; }</style>
  <script>
    // WebKit#301994 (26.1 出现, 26.2 修复, 26.5+/27 复发) 的两种表现:
    //   A. 系统画白块把网页下推 (26.1) — 无需补偿
    //   B. 网页顶到屏幕顶端, 状态栏浮盖 header, 顶部按钮点不到 (复发版)
    // 运行时探测: black-translucent 下健康系统必上报非零 inset-top,
    // 报 0 即中 bug. 被盖高度 = screen.height - innerHeight, 写入全局值,
    // Dart 侧 McAppHeader 读取并手动下推顶栏.
    (function () {
      try {
        var ua = navigator.userAgent
        if (!/iPhone|iPod|iPad/.test(ua)) return
        var standalone = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        if (!standalone) return
        if (/OS 26_[12]_/.test(ua)) return // 26.1 为表现A(下推), 26.2 已修复
        var probe = document.createElement('div')
        probe.style.cssText = 'position:absolute;top:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)'
        document.documentElement.appendChild(probe)
        var inset = parseFloat(getComputedStyle(probe).paddingTop) || 0
        probe.remove()
        if (inset > 0) return // 系统正常上报, Flutter SafeArea 自处理
        var gap = window.screen.height - window.innerHeight
        window.__mcTopCover = (gap >= 40 && gap <= 80) ? gap : 59
      } catch (e) { /* 探测失败静默 */ }
    })()
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>明策 MINGCE</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>

</html>
